name: Publish to MDSpec

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Substitute Confluence link URL
        run: |
          if [ -n "$CONFLUENCE_BASE_URL" ] && [ -n "$CONFLUENCE_SPACE_KEY" ]; then
            sed -i "s|id:360449|link:${CONFLUENCE_BASE_URL}/wiki/spaces/${CONFLUENCE_SPACE_KEY}/pages/360449|g" confluence-link/.mdspecmap
          fi
        env:
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}

      - run: npx mdspeci@0.4.39 publish --project 7d656b4d-9e66-4fff-a807-86d4f0f96a0d
        env:
          MDSPEC_TOKEN: ${{ secrets.MDSPEC_TOKEN }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
